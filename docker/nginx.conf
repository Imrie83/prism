# Compact log format — method, path, status, size, response time only
log_format compact '$request_method $request_uri → $status '
                   '${body_bytes_sent}b ${request_time}s';

# Suppress successful responses — only log 4xx/5xx
map $status $loggable {
    ~^[23]  0;
    default 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large request bodies — batch scan/email payloads include screenshots
    # and full scan results that can easily exceed nginx's 1MB default
    client_max_body_size 50m;

    # Only log errors — suppresses polling and all successful API calls
    access_log /var/log/nginx/access.log compact if=$loggable;

    # Proxy all /api calls to the backend container
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Important for streaming (ndjson keepalives)
        proxy_buffering    off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        chunked_transfer_encoding on;

        # Only log API errors — no more polling noise
        access_log /var/log/nginx/access.log compact if=$loggable;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        access_log /var/log/nginx/access.log compact if=$loggable;
    }
}
